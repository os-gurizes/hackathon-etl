[project]
name = "vstats"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "shapely>=2.0",
    "lightgbm>=4.5",
]

[project.scripts]
vstats = "vstats.cli:app"

[dependency-groups]
dev = ["pytest>=8", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running Postgres (VSTATS_DATABASE_URL)"]
