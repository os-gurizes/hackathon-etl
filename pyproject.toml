[project]
name = "vstats"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
]

[project.scripts]
vstats = "vstats.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running Postgres (VSTATS_DATABASE_URL)"]
